<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UMKC | Flight Routes System</title>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body data-theme="light">
        <nav class="navbar">
            <div style="font-weight: 700">
                Flight Routes
                <span style="font-weight: 300; color: var(--text-muted)">System</span>
            </div>
            <button class="btn" onclick="toggleTheme()">Dark / Light Mode</button>
        </nav>

        <div class="main-container">
            <div id="map"></div>

            <aside class="sidebar">
                <div class="control-group">
                    <div class="sidebar-title">Display Metrics (Weight)</div>
                    <button
                        id="btn-price"
                        class="btn active"
                        onclick="setWeightMode('price')"
                    >
                        Show Flight Prices ($)
                    </button>
                    <button
                        id="btn-duration"
                        class="btn"
                        onclick="setWeightMode('duration')"
                    >
                        Show Duration (Min)
                    </button>
                </div>

                <div class="control-group">
                    <div class="sidebar-title">Active Itinerary</div>
                    <div id="itinerary-box" class="itinerary-card">
                        <div id="stat-line" style="font-size: 0.8rem; font-weight: bold">
                            No active path.
                        </div>
                    </div>
                </div>

                <div
                    style="margin-top: auto; font-size: 0.7rem; color: var(--text-muted)"
                >
                    Discrete Structures II | Graph Analysis
                </div>
            </aside>
        </div>

        <script src="settings.js"></script>
        <script src="network_data.js"></script>
        <script src="route_data.js"></script>
        <script src="script.js"></script>
    </body>
</html>
